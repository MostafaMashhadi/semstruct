[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semstruct"
version = "0.1.0"
description = "Offline DistilBERT adaptation for semantic-structural relational keyword search."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mostafa Mashhadizadeh"}]
keywords = ["relational-keyword-search", "distilbert", "semstruct"]
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=1.1.0",
    "scikit-learn>=1.4",
    "PyYAML>=6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
semstruct = "semstruct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
